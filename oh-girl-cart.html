<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кошик — OH GIRL</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#29251f;font-family:Inter,Arial,sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 5vw 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:22px}
.logo{font-size:25px;letter-spacing:-1.5px;font-weight:700;color:inherit;text-decoration:none}.back{color:#6c6a62;text-decoration:none;font-size:14px}
h1{font-size:clamp(30px,5vw,48px);letter-spacing:-2px;font-weight:500;margin:48px 0 30px}
.cart-layout{display:grid;grid-template-columns:1.5fr .8fr;gap:55px}.items{border-top:1px solid #e9e7e2}
.item{display:grid;grid-template-columns:1fr auto;gap:20px;padding:23px 0;border-bottom:1px solid #e9e7e2}
.name{font-size:17px;margin-bottom:9px}.unit{font-size:14px;color:#777}.controls{display:flex;align-items:center;gap:12px;margin-top:16px}
.qty{display:flex;align-items:center;border:1px solid #dedbd4}.qty button{border:0;background:none;padding:7px 12px;font-size:17px;cursor:pointer}.qty span{min-width:24px;text-align:center;font-size:14px}
.remove{border:0;background:none;color:#8b867e;text-decoration:underline;font-size:12px;cursor:pointer}
.line-price{font-size:16px;white-space:nowrap}.summary{background:#f7f6f2;padding:26px;height:max-content}.summary h2{font-size:19px;font-weight:500;margin:0 0 25px}
.total{display:flex;justify-content:space-between;border-top:1px solid #dedbd4;padding-top:18px;margin-top:18px;font-size:18px}
.checkout{display:block;text-align:center;background:#29251f;color:#fff;text-decoration:none;padding:17px;margin-top:25px;font-size:14px;letter-spacing:.2px}
.note{font-size:12px;color:#777;line-height:1.6;margin-top:16px}.empty{padding:30px 0;color:#777}.continue{display:inline-block;margin-top:18px;color:#29251f}
@media(max-width:700px){.cart-layout{grid-template-columns:1fr;gap:25px}.wrap{padding-top:20px}.summary{padding:22px}.item{grid-template-columns:1fr auto}}
</style></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html">OH GIRL</a><a class="back" href="index.html">← Продовжити покупки</a></header>
<h1>Ваш кошик</h1><div id="content"></div></div>
<script>
const KEY='ohGirlCart',read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}},save=x=>localStorage.setItem(KEY,JSON.stringify(x)),money=n=>new Intl.NumberFormat('uk-UA').format(n)+' ₴';
function render(){const items=read(),root=document.getElementById('content');if(!items.length){root.innerHTML='<div class="empty">Ваш кошик поки порожній.<br><a class="continue" href="index.html">Перейти до покупок →</a></div>';return}
const total=items.reduce((s,x)=>s+x.price*x.qty,0);
root.innerHTML='<div class="cart-layout"><section class="items">'+items.map((x,i)=>`<article class="item"><div><div class="name">${x.name}</div><div class="unit">${money(x.price)} / шт.</div><div class="controls"><div class="qty"><button data-action="minus" data-i="${i}">−</button><span>${x.qty}</span><button data-action="plus" data-i="${i}">+</button></div><button class="remove" data-action="remove" data-i="${i}">Видалити</button></div></div><div class="line-price">${money(x.price*x.qty)}</div></article>`).join('')+'</section><aside class="summary"><h2>Разом</h2><div>Товарів: '+items.reduce((s,x)=>s+x.qty,0)+'</div><div class="total"><span>До сплати</span><strong>'+money(total)+'</strong></div><a class="checkout" href="oh-girl-checkout.html">Перейти до оформлення</a><p class="note">Вартість доставки буде визначена під час оформлення замовлення.</p></aside></div>';
root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=read(),i=+b.dataset.i,act=b.dataset.action;if(act==='plus')a[i].qty++;if(act==='minus')a[i].qty=Math.max(1,a[i].qty-1);if(act==='remove')a.splice(i,1);save(a);render()}));}
render();
</script></body></html>
